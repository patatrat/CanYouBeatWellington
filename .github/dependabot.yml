version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # These require non-trivial migration work — update manually when ready
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss-animate"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react doesn't support ESLint v10 yet — unblock when it does
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet, so lint fails on
      # every PR that includes it (#48-#51, #56) — unblock when it does
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Minor and patch updates come as one grouped PR. Majors that aren't
    # ignored above each get their own PR, so one breaking upgrade can't
    # hold back all the routine ones.
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
