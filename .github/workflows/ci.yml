name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Cancels a run the moment a newer commit on the same branch supersedes it —
# without this, pushing a few commits in quick succession lets every run
# finish even after a later one already makes it moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AP_PUBLIC_KEY: ${{ secrets.AP_PUBLIC_KEY }}
          AP_PRIVATE_KEY: ${{ secrets.AP_PRIVATE_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      # --omit=dev: scoped to production deps deliberately, not as a blanket
      # policy. GHSA-mh99-v99m-4gvg (brace-expansion DoS) currently has no
      # fix compatible with the old minimatch@2-3.x line that ESLint's own
      # plugin ecosystem (eslint-plugin-import/jsx-a11y/react, @eslint/*)
      # still depends on — the only listed patch (5.0.8) breaks that API.
      # That chain is 100% devDependency/build-time lint tooling with no
      # shipped code and no untrusted input, so it can't be fixed here
      # without breaking lint until upstream bumps their own dependency.
      # See CLAUDE.md's P2 backlog for the tracking item.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
