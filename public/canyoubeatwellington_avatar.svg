  <text x="340" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#facc15" letter-spacing="2" style="fill:rgb(250, 204, 21);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:system-ui, sans-serif;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:auto">CAN YOU BEAT</text>
