  <path d="M0 460 Q60 310 160 340 Q220 300 290 260 Q340 230 390 255 Q460 210 530 250 Q600 230 680 290 L680 460 Z" fill="#0a3d7a" style="fill:rgb(10, 61, 122);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

